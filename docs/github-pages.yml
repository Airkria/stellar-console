# GitHub Pages deployment template.
#
# GitHub OAuth tokens created by `gh auth login` do not include the `workflow`
# scope by default, so this file is kept outside `.github/workflows/`.
# To enable automatic deployment:
#   1. gh auth refresh -h github.com -s workflow
#   2. move this file to .github/workflows/deploy.yml
#   3. commit and push to Main
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
